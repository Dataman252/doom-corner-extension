<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; height: 100vh; }
  #game-area { flex: 1; position: relative; width: 100%; min-height: 0; overflow: hidden; }
  #game-frame { width: 100%; height: 100%; border: none; display: none; }
  #controls-bar {
    flex-shrink: 0; min-height: 45px; width: 100%; background: #0b0b14; border-top: 1px solid #1c1c2c;
    display: flex; align-items: center; justify-content: space-between; padding: 8px 15px; color: #c87800; font-size: 13px; gap: 12px; box-sizing: border-box; flex-wrap: wrap; z-index: 20;
  }
  #placeholder { position: absolute; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; color: #555; text-align: center; z-index: 10; }
  #controls-text { flex: 1 1 300px; white-space: normal; line-height: 1.4; font-family: monospace; font-size: 12px; }
  #now-playing { color: #556; font-weight: bold; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  button { background: #12121e; border: 1px solid #162440; border-radius: 4px; color: #3a7fd4; font-weight: bold; padding: 8px 14px; cursor: pointer; font-size: 12px; margin: 5px; }
  button:hover { background: #162440; color: #7ab8ff; }
  select { background: #0b0b14; color: #3a7fd4; border: 1px solid #162440; padding: 8px; font-size: 14px; border-radius: 4px; width: 280px; margin-bottom: 15px; }
</style>
</head>
<body>

<div id="game-area">
  <div id="placeholder">
    <div id="ui-box">
      <div style="font-size:40px; margin-bottom: 10px;">🎮</div>
      <div id="setup-view">
        <div style="font-size: 18px; color: #fff; margin-bottom: 5px;">DOOM CORNER</div>
        <button id="load-folder-btn">📁 SELECT ROM FOLDER</button>
        <input type="file" id="folder-input" webkitdirectory directory multiple style="display:none">
      </div>
      <div id="library-view" style="display: none;">
        <select id="rom-select"></select><br>
        <button id="play-btn">▶ START GAME</button>
      </div>
    </div>
  </div>
  <iframe id="game-frame" src="https://dataman252.github.io/doom-corner-engine/sandbox.html?v=7"></iframe>
</div>

<div id="controls-bar">
  <button id="quit-btn" style="color: #d43a3a; display: none;">🛑 QUIT</button>
  <span id="controls-text">Select a folder to begin.</span>
  <div style="display: flex; gap: 8px; align-items: center;">
    <button id="mute-btn" style="padding: 4px 8px;">🔊</button>
    <input type="range" id="vol-slider" min="0" max="1" step="0.05" value="1" style="width: 60px;">
  </div>
  <span id="now-playing">STANDBY</span>
</div>

<script src="index.js"></script>
</body>
</html>
